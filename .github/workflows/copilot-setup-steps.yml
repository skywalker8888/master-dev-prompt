name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COPILOT_AGENT_MODEL: auto
    steps:
      - name: Confirm Copilot model selection mode
        run: echo "COPILOT_AGENT_MODEL=$COPILOT_AGENT_MODEL"
