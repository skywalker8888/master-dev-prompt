name: Hermes tests

on:
  pull_request:
    paths:
      - 'hermes/**'
      - '.github/workflows/hermes-tests.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'hermes/**'
      - '.github/workflows/hermes-tests.yml'

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: hermes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python3 -m pytest tests/ -v
